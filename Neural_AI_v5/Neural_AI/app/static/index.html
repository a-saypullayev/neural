<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neural AI</title><link rel="icon" href="/favicon.ico"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0d0a14"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Neural AI"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="/static/css/style.css">
</head><body>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-top">
      <button class="btn" id="newChat">+ New chat</button>
      <button class="btn ghost" id="memBtn">Memories</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-foot">
      <div id="usageText">Daily usage</div><div class="meter"><i id="usageBar"></i></div>
      <a href="/keys">Manage API keys</a>
      <a href="/download" style="display:block;margin-top:6px">Get the Windows app</a>
    </div>
  </aside>
  <main class="main">
    <div class="msgs" id="msgs"><div class="msgs-inner" id="msgsInner"></div></div>
    <div class="composer"><div class="composer-box">
      <textarea id="input" rows="1" placeholder="Message Neural…" aria-label="Message"></textarea>
      <div class="composer-row">
        <label class="toggle"><input type="checkbox" id="searchToggle"> Search the web</label>
        <button class="btn" id="send">Send</button>
      </div>
    </div></div>
  </main>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/pwa.js"></script>
</body></html>
