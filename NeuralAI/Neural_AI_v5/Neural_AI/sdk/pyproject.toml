[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralai"
version = "0.1.0"
description = "Python SDK for the Neural AI REST API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["requests>=2.28"]
license = { text = "MIT" }
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[tool.setuptools]
packages = ["neuralai"]
