services:
  - type: web
    name: neural-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: qwen3.5:4b
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: neural-db
          property: connectionString

databases:
  - name: neural-db
    plan: basic-256mb
    databaseName: neural
    user: neural
